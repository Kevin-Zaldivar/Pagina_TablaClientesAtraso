<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Cobros - Servicredith</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f0f2f5;padding:20px}
    .container{max-width:1100px;margin:0 auto;background:white;border-radius:10px;padding:30px;box-shadow:0 2px 12px rgba(0,0,0,0.12)}
    h1{color:#1a237e;margin-bottom:4px}
    .subtitle{color:#666;margin-bottom:22px;font-size:14px}
    .stats{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
    .stat-card{padding:10px 20px;border-radius:8px;color:white;font-weight:bold;font-size:14px}
    .s-total{background:#1a237e}.s-1{background:#FFA500}.s-2{background:#FF6600}.s-3{background:#CC0000}
    .controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .btn{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold}
    .b-all{background:#e3f2fd;color:#1565c0}.b-none{background:#fce4ec;color:#c62828}
    .b-1{background:#fff3e0;color:#e65100}.b-2{background:#fbe9e7;color:#bf360c}.b-3{background:#ffebee;color:#b71c1c}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead{background:#1a237e;color:white}
    th{padding:10px 8px;text-align:left;white-space:nowrap}
    td{padding:8px;border-bottom:1px solid #eee;vertical-align:middle}
    tr:hover{background:#f9f9f9}
    input[type=checkbox]{width:17px;height:17px;cursor:pointer}
    .badge{padding:3px 8px;border-radius:4px;color:white;font-size:11px;font-weight:bold;white-space:nowrap}
    .badge-1{background:#FFA500}.badge-2{background:#FF6600}.badge-3{background:#CC0000}
    .footer{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn-enviar{background:#1a237e;color:white;padding:11px 30px;font-size:15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
    .btn-enviar:hover{background:#283593}
    .btn-enviar:disabled{background:#90a4ae;cursor:not-allowed}
    .btn-cancelar{background:#eee;color:#333;padding:11px 22px;font-size:14px;border:none;border-radius:8px;cursor:pointer}
    #contador{color:#555;font-size:14px;font-weight:bold}
    .alert-info{background:#e3f2fd;color:#1565c0;border-left:4px solid #1565c0;padding:12px 18px;border-radius:6px;margin-bottom:15px;font-size:13px}
    .sin-tel{color:#e53935;font-size:11px;font-style:italic}
    .loading{text-align:center;padding:40px;color:#666;font-size:16px}
    .error{background:#ffebee;color:#c62828;padding:15px;border-radius:6px;margin:20px 0}
    .refresh-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:8px 14px;background:#f8f9fa;border-radius:7px;font-size:12px;color:#555;border:1px solid #e0e0e0}
    .refresh-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;flex-shrink:0}
    .refresh-dot.syncing{background:#ffa500;animation:pulse 0.8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .refresh-progress{flex:1;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden}
    .refresh-progress-fill{height:100%;background:#1a237e;border-radius:2px;transition:width 1s linear}
    .refresh-count{font-weight:bold;color:#1a237e}
    @media(max-width:700px){
      table{font-size:11px}th,td{padding:5px 4px}
      .container{padding:15px}
      .stats{gap:8px}
      .stat-card{padding:8px 12px;font-size:12px}
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📋 Gestión de Cobros</h1>
  <p class="subtitle">Servicredith - Área de Cobros</p>

  <div id="app">
    <div class="loading">⏳ Cargando clientes en atraso...</div>
  </div>
</div>

<script>
  // ══════════════════════════════════════════════
  //  CONFIGURACIÓN
  // ══════════════════════════════════════════════
  const WEBHOOK_DATOS = 'https://n8n-n8n.1jajp5.easypanel.host/webhook/cobros-datos';
  const WEBHOOK_CONFIRMACION = 'https://n8n-n8n.1jajp5.easypanel.host/webhook/cobros-confirmacion';

  const INTERVALO_SEGUNDOS = 600; // ← Cambia aquí el intervalo de actualización (en segundos)

  // ══════════════════════════════════════════════
  //  Estado global
  // ══════════════════════════════════════════════
  let _clientes        = [];
  let _primeraVez      = true;
  let _intervaloId     = null;
  let _cuentaRegresiva = INTERVALO_SEGUNDOS;
  let _intervaloBar    = null;

  // ══════════════════════════════════════════════
  //  Obtener IDs actualmente seleccionados
  // ══════════════════════════════════════════════
  function getSeleccionados() {
    const ids = new Set();
    document.querySelectorAll('input[name="ids"]:checked').forEach(cb => ids.add(cb.value));
    return ids;
  }

  // ══════════════════════════════════════════════
  //  Cargar datos desde n8n
  // ══════════════════════════════════════════════
  async function cargarClientes(silencioso = false) {
    // Indicar que está sincronizando
    const dot = document.getElementById('refresh-dot');
    const lbl = document.getElementById('refresh-lbl');
    if (dot) { dot.classList.add('syncing'); }
    if (lbl) { lbl.textContent = 'Sincronizando...'; }

    try {
      const resp = await fetch(WEBHOOK_DATOS + '?t=' + Date.now()); // evita caché
      if (!resp.ok) throw new Error('Error HTTP ' + resp.status);

      let text = await resp.text();
      if (text.startsWith('=')) text = text.substring(1);

      const data     = JSON.parse(text);
      const clientes = Array.isArray(data) ? data : (data.clientes || []);

      if (_primeraVez) {
        _primeraVez = false;
        renderApp(clientes); // render completo la primera vez
      } else {
        actualizarTabla(clientes); // solo actualiza datos sin resetear la UI
      }

      _clientes = clientes;

      const ahora = new Date().toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (dot) { dot.classList.remove('syncing'); }
      if (lbl) { lbl.textContent = 'Última actualización: ' + ahora; }

    } catch(e) {
      if (dot) { dot.classList.remove('syncing'); }
      if (lbl) { lbl.textContent = '⚠️ Error al sincronizar'; }

      if (_primeraVez) {
        document.getElementById('app').innerHTML = `
          <div class="error">
            ❌ No se pudieron cargar los datos.<br>
            <small>${e.message}</small><br><br>
            <button class="btn b-all" onclick="cargarClientes()">🔄 Reintentar</button>
          </div>`;
      }
    }
  }

  // ══════════════════════════════════════════════
  //  Actualización SILENCIOSA — preserva selecciones
  // ══════════════════════════════════════════════
  function actualizarTabla(clientes) {
    const idsSeleccionados = getSeleccionados(); // guardar qué tenía marcado el usuario
    const etiquetas = {
      AVISO_1:       { texto: '⚠️ 1 Cuota Vencida',  clase: 'badge-1' },
      AVISO_2:       { texto: '🔴 2 Cuotas Vencidas', clase: 'badge-2' },
      AVISO_3_FINAL: { texto: '🚨 ÚLTIMO AVISO (3+)', clase: 'badge-3' }
    };

    const tbody = document.querySelector('tbody');
    if (!tbody) return; // si la tabla aún no existe, salir

    // Actualizar filas
    tbody.innerHTML = clientes.map(c => {
      const e       = etiquetas[c.Nivel] || { texto: c.Nivel, clase: 'badge-1' };
      const telHtml = c.Telefono ? c.Telefono : '<span class="sin-tel">Sin teléfono</span>';
      // Respetar selección previa; si es nuevo cliente con teléfono, marcarlo
      const checked = idsSeleccionados.has(c.ID_Credito)
        ? 'checked'
        : (c.Telefono && !idsSeleccionados.size ? 'checked' : (c.Telefono ? '' : ''));
      return `
        <tr>
          <td style="text-align:center">
            <input type="checkbox" name="ids" value="${c.ID_Credito}" data-nivel="${c.Nivel}" ${checked}>
          </td>
          <td>${c.ID_Credito}</td>
          <td>${c.Nombre}</td>
          <td>${telHtml}</td>
          <td><span class="badge ${e.clase}">${e.texto}</span></td>
          <td style="text-align:center">${c.Cuotas_Vencidas}</td>
          <td style="text-align:center">${c.Dias_Atraso} días</td>
          <td>${c.Total_vencido}</td>
          <td>${c.Monto_Cuota}</td>
        </tr>`;
    }).join('');

    // Actualizar estadísticas
    const total  = clientes.length;
    const total1 = clientes.filter(c => c.Nivel === 'AVISO_1').length;
    const total2 = clientes.filter(c => c.Nivel === 'AVISO_2').length;
    const total3 = clientes.filter(c => c.Nivel === 'AVISO_3_FINAL').length;
    const sc = document.querySelectorAll('.stat-card');
    if (sc[0]) sc[0].textContent = 'Total: '      + total;
    if (sc[1]) sc[1].textContent = '⚠️ 1 cuota: ' + total1;
    if (sc[2]) sc[2].textContent = '🔴 2 cuotas: ' + total2;
    if (sc[3]) sc[3].textContent = '🚨 3+ cuotas: '+ total3;

    // Volver a enlazar eventos de checkboxes
    document.querySelectorAll('input[name="ids"]')
      .forEach(cb => cb.addEventListener('change', updateCount));
    updateCount();
  }

  // ══════════════════════════════════════════════
  //  Render completo (primera carga)
  // ══════════════════════════════════════════════
  function renderApp(clientes) {
    _clientes = clientes;
    const total  = clientes.length;
    const total1 = clientes.filter(c => c.Nivel === 'AVISO_1').length;
    const total2 = clientes.filter(c => c.Nivel === 'AVISO_2').length;
    const total3 = clientes.filter(c => c.Nivel === 'AVISO_3_FINAL').length;

    const etiquetas = {
      AVISO_1:       { texto: '⚠️ 1 Cuota Vencida',  clase: 'badge-1' },
      AVISO_2:       { texto: '🔴 2 Cuotas Vencidas', clase: 'badge-2' },
      AVISO_3_FINAL: { texto: '🚨 ÚLTIMO AVISO (3+)', clase: 'badge-3' }
    };

    const filas = clientes.map(c => {
      const e       = etiquetas[c.Nivel] || { texto: c.Nivel, clase: 'badge-1' };
      const telHtml = c.Telefono ? c.Telefono : '<span class="sin-tel">Sin teléfono</span>';
      const checked = c.Telefono ? 'checked' : '';
      return `
        <tr>
          <td style="text-align:center">
            <input type="checkbox" name="ids" value="${c.ID_Credito}" data-nivel="${c.Nivel}" ${checked}>
          </td>
          <td>${c.ID_Credito}</td>
          <td>${c.Nombre}</td>
          <td>${telHtml}</td>
          <td><span class="badge ${e.clase}">${e.texto}</span></td>
          <td style="text-align:center">${c.Cuotas_Vencidas}</td>
          <td style="text-align:center">${c.Dias_Atraso} días</td>
          <td>${c.Total_vencido}</td>
          <td>${c.Monto_Cuota}</td>
        </tr>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="alert-info">
        ℹ️ Todos los clientes con teléfono vienen <strong>seleccionados por defecto</strong>.
        Desmarque los que NO desea notificar.
      </div>

      <!-- Barra de auto-actualización -->
      <div class="refresh-bar">
        <span class="refresh-dot" id="refresh-dot"></span>
        <span id="refresh-lbl">Cargado</span>
        <div class="refresh-progress">
          <div class="refresh-progress-fill" id="refresh-fill" style="width:100%"></div>
        </div>
        <span>Próx. actualización: <span class="refresh-count" id="refresh-count">${INTERVALO_SEGUNDOS}s</span></span>
      </div>

      <div class="stats">
        <div class="stat-card s-total">Total: ${total}</div>
        <div class="stat-card s-1">⚠️ 1 cuota: ${total1}</div>
        <div class="stat-card s-2">🔴 2 cuotas: ${total2}</div>
        <div class="stat-card s-3">🚨 3+ cuotas: ${total3}</div>
      </div>

      <div class="controls">
        <button class="btn b-all"  id="btn-todos">✅ Todos</button>
        <button class="btn b-none" id="btn-ninguno">❌ Ninguno</button>
        <button class="btn b-1"   id="btn-1">Solo 1 cuota</button>
        <button class="btn b-2"   id="btn-2">Solo 2 cuotas</button>
        <button class="btn b-3"   id="btn-3">Solo último aviso</button>
        <button class="btn b-all" id="btn-refresh" style="background:#f3e5f5;color:#6a1b9a">🔄 Actualizar ahora</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Enviar</th><th>ID Crédito</th><th>Nombre</th><th>Teléfono</th>
            <th>Nivel</th><th>Cuotas</th><th>Atraso</th><th>Total vencido</th><th>Cuota</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>

      <div class="footer">
        <button class="btn-enviar" id="btn-enviar">📤 Enviar Notificaciones</button>
        <button class="btn-cancelar" id="btn-cancelar">Cancelar</button>
        <span id="contador"></span>
      </div>`;

    // Event listeners (sin onclick inline)
    document.getElementById('btn-todos').addEventListener('click', () => sel(true));
    document.getElementById('btn-ninguno').addEventListener('click', () => sel(false));
    document.getElementById('btn-1').addEventListener('click', () => selNivel('AVISO_1'));
    document.getElementById('btn-2').addEventListener('click', () => selNivel('AVISO_2'));
    document.getElementById('btn-3').addEventListener('click', () => selNivel('AVISO_3_FINAL'));
    document.getElementById('btn-refresh').addEventListener('click', () => {
      resetCuentaRegresiva();
      cargarClientes();
    });
    document.getElementById('btn-enviar').addEventListener('click', enviar);
    document.getElementById('btn-cancelar').addEventListener('click', cancelar);
    document.querySelectorAll('input[name="ids"]').forEach(cb => cb.addEventListener('change', updateCount));

    updateCount();
    iniciarAutoRefresh();
  }

  // ══════════════════════════════════════════════
  //  Auto-refresh con barra de progreso
  // ══════════════════════════════════════════════
  function resetCuentaRegresiva() {
    _cuentaRegresiva = INTERVALO_SEGUNDOS;
    const fill = document.getElementById('refresh-fill');
    if (fill) fill.style.width = '100%';
  }

  function iniciarAutoRefresh() {
    // Limpiar intervalos previos si existen
    if (_intervaloId)  clearInterval(_intervaloId);
    if (_intervaloBar) clearInterval(_intervaloBar);

    _cuentaRegresiva = INTERVALO_SEGUNDOS;

    // Intervalo de datos (cada INTERVALO_SEGUNDOS)
    _intervaloId = setInterval(() => {
      cargarClientes(true);
      resetCuentaRegresiva();
    }, INTERVALO_SEGUNDOS * 1000);

    // Intervalo de UI — actualiza barra y contador cada segundo
    _intervaloBar = setInterval(() => {
      _cuentaRegresiva--;
      if (_cuentaRegresiva < 0) _cuentaRegresiva = INTERVALO_SEGUNDOS;

      const pct  = (_cuentaRegresiva / INTERVALO_SEGUNDOS) * 100;
      const fill = document.getElementById('refresh-fill');
      const cnt  = document.getElementById('refresh-count');
      if (fill) fill.style.width = pct + '%';
      if (cnt)  cnt.textContent  = _cuentaRegresiva + 's';
    }, 1000);
  }

  // ══════════════════════════════════════════════
  //  Selección
  // ══════════════════════════════════════════════
  function updateCount() {
    const n  = document.querySelectorAll('input[name="ids"]:checked').length;
    const el = document.getElementById('contador');
    if (el) el.textContent = n + ' cliente(s) seleccionado(s)';
  }
  function sel(v) {
    document.querySelectorAll('input[name="ids"]').forEach(c => c.checked = v);
    updateCount();
  }
  function selNivel(nivel) {
    document.querySelectorAll('input[name="ids"]').forEach(cb => {
      cb.checked = cb.dataset.nivel === nivel;
    });
    updateCount();
  }

  // ══════════════════════════════════════════════
  //  Enviar notificaciones
  // ══════════════════════════════════════════════
  async function enviar() {
    const seleccionados = [];
    document.querySelectorAll('input[name="ids"]:checked').forEach(cb => {
      const c = _clientes.find(x => x.ID_Credito === cb.value);
      if (c) seleccionados.push(c);
    });

    if (!seleccionados.length) { alert('Seleccione al menos un cliente.'); return; }

    const sinTel = seleccionados.filter(c => !c.Telefono);
    if (sinTel.length > 0) {
      const ok = confirm(`⚠️ ${sinTel.length} cliente(s) no tienen teléfono y serán ignorados.\n¿Desea continuar con los ${seleccionados.length - sinTel.length} restantes?`);
      if (!ok) return;
    }

    const conTel = seleccionados.filter(c => c.Telefono);
    if (!conTel.length) { alert('Ningún cliente seleccionado tiene teléfono registrado.'); return; }
    if (!confirm(`¿Confirma enviar notificaciones a ${conTel.length} cliente(s)?`)) return;

    // Pausar auto-refresh mientras se envía
    if (_intervaloId)  clearInterval(_intervaloId);
    if (_intervaloBar) clearInterval(_intervaloBar);

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.textContent = '⏳ Enviando...';

    try {
      await fetch(WEBHOOK_CONFIRMACION, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seleccionados: conTel })
      });

      btn.textContent = '✅ Enviado correctamente';
      btn.style.background = '#2e7d32';
      document.getElementById('contador').textContent = '✅ ' + conTel.length + ' notificaciones enviadas';

    } catch(e) {
      btn.disabled = false;
      btn.textContent = '📤 Enviar Notificaciones';
      alert('Error al enviar. Intente nuevamente.');
      iniciarAutoRefresh(); // reanudar si hubo error
    }
  }

  async function cancelar() {
    if (!confirm('¿Cancelar sin enviar notificaciones?')) return;
    if (_intervaloId)  clearInterval(_intervaloId);
    if (_intervaloBar) clearInterval(_intervaloBar);
    fetch(WEBHOOK_CONFIRMACION, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cancelado: true, seleccionados: [] })
    });
    document.getElementById('app').innerHTML =
      '<div style="text-align:center;padding:60px"><h2>❌ Operación cancelada</h2><br><button class="btn b-all" onclick="location.reload()">🔄 Volver</button></div>';
  }

  // Iniciar
  cargarClientes();

setInterval(() => {
  cargarClientes();
}, 600000);
</script>
</body>
</html>
